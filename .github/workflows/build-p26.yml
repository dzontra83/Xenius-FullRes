name: Build Xenius FullRes P26 F200 RAW APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'XENIUS_P26_FULLRES_50_200MP_SOURCE.zip'
      - '.github/workflows/build-p26.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 using installed commandline tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMGR"
          "$SDKMGR" --version
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract P26 source
        run: |
          test -f XENIUS_P26_FULLRES_50_200MP_SOURCE.zip
          mkdir -p xenius-p26
          unzip -q XENIUS_P26_FULLRES_50_200MP_SOURCE.zip -d xenius-p26
          test -f xenius-p26/settings.gradle
          test -f xenius-p26/app/build.gradle

      - name: Apply P26 orientation metadata fix
        run: python3 scripts/patch_p25b_orientation.py xenius-p26

      - name: Build debug APK
        working-directory: xenius-p26
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XENIUS_P26_F50_F200_DEBUG_APK
          path: xenius-p26/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error