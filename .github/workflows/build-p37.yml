name: Build Xenius Latency Lab P37

on:
  workflow_dispatch:
  push:
    paths:
      - 'XENIUS_P37_LATENCY_LAB_SOURCE.zip'
      - '.github/workflows/build-p35.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMGR"
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract P37 source
        run: |
          set -euo pipefail
          mkdir -p xenius-p37
          unzip -q XENIUS_P37_LATENCY_LAB_SOURCE.zip -d xenius-p37
          grep -q 'EngineerRemosaicMode' xenius-p37/app/src/main/java/com/xenius/fullresprobe/MainActivity.java
          grep -q "applicationId 'com.xenius.latencylab'" xenius-p37/app/build.gradle
      - name: Build P37 debug APK
        working-directory: xenius-p37
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: XENIUS_P37_LATENCY_LAB_DEBUG_APK
          path: xenius-p37/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Commit APK to branch (artifact download is blocked for the build assistant)
        run: |
          set -euo pipefail
          mkdir -p builds
          cp xenius-p37/app/build/outputs/apk/debug/app-debug.apk builds/XENIUS_P37_LATENCY_LAB_DEBUG.apk
          sha256sum builds/XENIUS_P37_LATENCY_LAB_DEBUG.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/XENIUS_P37_LATENCY_LAB_DEBUG.apk
          git commit -m "CI: P37 Stream Lab debug APK" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
