name: Build Xenius P30 GCam Bridge 2x50 MP

on:
  workflow_dispatch:
  push:
    paths:
      - 'XENIUS_P30_GCAM_BRIDGE_2X50_SOURCE.zip'
      - '.github/workflows/build-p30.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMGR"
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract P30 source
        run: |
          set -euo pipefail
          mkdir -p xenius-p30
          unzip -q XENIUS_P30_GCAM_BRIDGE_2X50_SOURCE.zip -d xenius-p30
          grep -q 'GCAM_BRIDGE_PAIR_READY' xenius-p30/app/src/main/java/com/xenius/fullresprobe/MainActivity.java
          grep -q "applicationId 'com.xenius.gcambridge50'" xenius-p30/app/build.gradle
      - name: Build P30 debug APK
        working-directory: xenius-p30
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: XENIUS_P30_GCAM_BRIDGE_2X50_DEBUG_APK
          path: xenius-p30/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
