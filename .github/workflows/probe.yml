name: probe
on:
  push:
    branches: [probe-build]
    paths: ['probe/**', '.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Build debug APK
        run: |
          mkdir -p probe/out
          cd probe
          set -o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee out/build.log
          cp build/outputs/apk/debug/*.apk out/vivo-fullres-probe-debug.apk
      - name: Commit result (APK or log)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe/out
          git commit -m "probe: build output [skip ci]" || exit 0
          git push
