name: Build Xenius P29 2x F200 RAW DNG saver

on:
  workflow_dispatch:
  push:
    paths:
      - 'XENIUS_P29_F200_2DNG_SOURCE.zip'
      - '.github/workflows/build-p29.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMGR"
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract P29 2-frame DNG source
        run: |
          set -euo pipefail
          mkdir -p xenius-p29
          unzip -q XENIUS_P29_F200_2DNG_SOURCE.zip -d xenius-p29
          grep -q 'BURST_2_DNG_WRITTEN' xenius-p29/app/src/main/java/com/xenius/fullresprobe/MainActivity.java
          grep -q "applicationId 'com.xenius.fullresburstsave'" xenius-p29/app/build.gradle
      - name: Build P29 debug APK
        working-directory: xenius-p29
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: XENIUS_P29_F200_BURST_2_DNG_APK
          path: xenius-p29/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
